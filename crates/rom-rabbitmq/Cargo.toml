[package]
name = "rom-rabbitmq"
description = "Mandatory confirmed AMQP publication for ROM channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
broker-conformance = []

[dependencies]
rom = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", default-features = false }
rom-delivery-core = { path = "../rom-delivery-core" }
lapin = { version = "=4.12.0", default-features = false, features = ["tokio", "rustls", "rustls--aws_lc_rs", "rustls-native-certs"] }
tokio = { version = "=1.53.1", features = ["time", "sync"] }

[dev-dependencies]
rom = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", default-features = false, features = ["derive"] }
rom-sqlite = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
rom-redb = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
tokio = { version = "=1.53.1", features = ["rt", "macros"] }

[[test]]
name = "broker"
required-features = ["broker-conformance"]

[[test]]
name = "runtime"
required-features = ["broker-conformance"]
