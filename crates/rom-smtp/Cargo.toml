[package]
name = "rom-smtp"
description = "Bounded authenticated TLS SMTP submission for ROM channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
controlled-protocol = []

[dependencies]
rom = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", default-features = false }
rom-email-core = { path = "../rom-email-core", version = "=0.1.0-dev" }
lettre = { version = "=0.11.23", default-features = false, features = ["smtp-transport", "tokio1"] }
tokio = { version = "=1.53.1", features = ["net", "time", "sync", "io-util", "macros"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.9"
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt", "macros"] }
serde_json = "=1.0.151"

[[test]]
name = "protocol"
required-features = ["controlled-protocol"]
