[package]
name = "rom-opensearch"
description = "Bounded externally versioned OpenSearch projection target"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[lints]
workspace = true
[features]
service-fixture = []
[dependencies]
rom-projection-http = { path = "../rom-projection-http", version = "=0.1.0-dev" }
rom = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
rom-projection-core = { path = "../rom-projection-core", version = "=0.1.0-dev" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.1", features = ["time"] }
[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt", "macros"] }
rom-sqlite = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
rom-redb = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
