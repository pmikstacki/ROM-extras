[package]
name = "rom-projection-core"
description = "Bounded durable projection intents and checkpoint orchestration"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rom = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
rom-backup = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
redb = "=4.3.0"
sha2 = "=0.10.9"

rom-sql-core = { version = "=0.1.0-dev", path = "../rom-sql-core" }
tokio = { version = "=1.53.1", default-features = false, features = ["sync"] }

[dev-dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["rt"] }

rom-sqlite = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
rom-redb = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
