[package]
name = "rom-mssql"
description = "Bounded native SQL Server ownership over the shared ROM SQL core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
rom-sql-core = { path = "../rom-sql-core", version = "=0.1.0-dev" }
tiberius = { version = "=0.13.0", default-features = false, features = ["tds73", "rustls"] }
tokio = { version = "=1.53.1", features = ["rt", "net", "time"] }
tokio-util = { version = "=0.7.19", features = ["compat"] }
