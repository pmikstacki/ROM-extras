[package]
name = "rom-blob-checkpoint"
description = "Bounded private inventories of current ROM checkpoint Blob publications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
[lints]
workspace = true
[features]
default = []
sqlite = ["rom-extras-maintenance/sqlite"]
redb = ["rom-extras-maintenance/redb"]
[dependencies]
rom = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
rom-blob = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
rom-backup = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
rom-blob-recovery = { version = "=0.1.0-dev", path = "../rom-blob-recovery" }
rom-extras-maintenance = { version = "=0.1.0-dev", path = "../rom-extras-maintenance", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
rom-sqlite = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
rom-redb = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
