[package]
name = "rom-map-http"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
[dependencies]
rom-map-core = { path = "../rom-map-core", version = "=0.1.0-dev" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
url = "=2.5.8"
tokio = { version = "=1.53.1", features = ["sync", "time", "macros"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
[dev-dependencies]
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "macros"] }
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "deny"

[features]
controlled-fixture = []
