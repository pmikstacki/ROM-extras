[package]
name = "rom-webhook"
description = "Bounded HTTPS transport for ROM channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
loopback-fixture = []

[dependencies]
rom = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", default-features = false }
rom-delivery-core = { path = "../rom-delivery-core" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.1", features = ["net", "time", "sync"] }
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt", "macros"] }
