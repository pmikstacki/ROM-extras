[workspace]
members = ["crates/rom-map-http", "crates/rom-nominatim", "crates/rom-map-core", "crates/rom-projection-http", "crates/rom-qdrant", "crates/rom-opensearch", "crates/rom-projection-core", "crates/rom-openbao", "crates/rom-kms", "crates/rom-secrets", "crates/rom-azure-blob", "crates/rom-sql-core", "crates/rom-oidc-presets", "crates/rom-delivery-core", "crates/rom-webhook", "crates/rom-nats", "crates/rom-rabbitmq", "crates/rom-kafka"]
exclude = ["tests/public-consumer", "tests/map-public-consumer", "tests/map-adapter-consumer"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/pmikstacki/ROM-extras"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "deny"
