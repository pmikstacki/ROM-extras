[workspace]
[package]
name = "rom-map-live-host-example"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["json", "tokio", "http1"] }
rom-maps-host-example = { path = "../maps-host" }
rom = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", version = "=0.0.3" }
rom-map-core = { path = "../../crates/rom-map-core" }
[dev-dependencies]
tokio = { version = "=1.53.1", features = ["rt", "macros", "net"] }
tower = { version = "=0.5.3", features = ["util"] }
rom-sqlite = { version = "=0.0.3", git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
reqwest = { version = "=0.13.5", default-features = false, features = ["json"] }
rom-maptiler = { path = "../../crates/rom-maptiler" }
