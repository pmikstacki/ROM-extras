[package]
name = "rom-extras-public-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace]

[features]
opensearch-conformance = ["dep:rom-opensearch", "dep:tokio", "dep:serde_json", "serde_json/arbitrary_precision", "serde_json/preserve_order"]
projection-checkpoints = ["dep:rom-sqlite", "dep:rom-redb", "dep:tokio", "dep:serde_json", "serde_json/arbitrary_precision", "serde_json/preserve_order"]
secrets-host = ["dep:tokio", "dep:rom-identity", "dep:rom-sqlite", "dep:rom-redb", "dep:serde_json"]
oracle-conformance = ["dep:oracle", "dep:tokio"]
s3-lifecycle = ["s3-conformance", "dep:rom-sqlite", "dep:rom-redb", "dep:futures-util"]
s3-conformance = ["dep:tokio", "dep:rom-blob-object-store", "dep:rom-conformance"]
azure-conformance = ["dep:tokio"]
mysql-conformance = ["dep:mysql", "dep:tokio"]
kafka-conformance = ["dep:rdkafka", "dep:tokio"]
rabbitmq-conformance = ["dep:lapin", "dep:tokio"]
nats-conformance = ["dep:async-nats", "dep:tokio"]
cockroach-conformance = ["dep:postgres", "dep:tokio"]
postgres-conformance = ["dep:postgres", "dep:tokio"]
mssql-conformance = ["dep:tiberius", "dep:tokio", "dep:tokio-util"]

[[test]]
name = "projection_search"
required-features = ["projection-checkpoints"]

[[test]]
name = "secrets_host"
required-features = ["secrets-host"]

[[test]]
name = "cockroach_executor"
required-features = ["cockroach-conformance"]

[[test]]
name = "azure_blob"
required-features = ["azure-conformance"]

[[test]]
name = "mysql_executor"
required-features = ["mysql-conformance"]

[[test]]
name = "kafka_delivery"
required-features = ["kafka-conformance"]

[[test]]
name = "postgres_executor"
required-features = ["postgres-conformance"]

[[test]]
name = "mssql_executor"
required-features = ["mssql-conformance"]

[[test]]
name = "nats_delivery"
required-features = ["nats-conformance"]

[[test]]
name = "rabbitmq_delivery"
required-features = ["rabbitmq-conformance"]

[[test]]
name = "s3_blob"
required-features = ["s3-conformance"]

[[test]]
name = "oracle_executor"
required-features = ["oracle-conformance"]

[[test]]
name = "opensearch"
required-features = ["opensearch-conformance"]

[dependencies]
rom-opensearch = { path = "../../crates/rom-opensearch", optional = true }
rom-projection-core = { path = "../../crates/rom-projection-core" }
rom-identity = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", optional = true }
serde_json = { version = "=1.0.151", optional = true }
rom-secrets = { path = "../../crates/rom-secrets" }
rom-kms = { path = "../../crates/rom-kms" }
rom-openbao = { path = "../../crates/rom-openbao" }
oracle = { version = "=0.6.3", default-features = false, optional = true }
rom-sqlite = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", optional = true }
rom-redb = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", optional = true }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"], optional = true }
rom-blob-object-store = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", optional = true }
rom-conformance = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", features = ["blob"], optional = true }
rom-azure-blob = { path = "../../crates/rom-azure-blob" }
rom-blob = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe" }
mysql = { version = "=28.0.3", default-features = false, features = ["minimal-rust", "native-tls"], optional = true }
rom-kafka = { path = "../../crates/rom-kafka" }
rdkafka = { version = "=0.39.0", default-features = false, features = ["tokio", "ssl"], optional = true }
rom-rabbitmq = { path = "../../crates/rom-rabbitmq" }
lapin = { version = "=4.12.0", default-features = false, features = ["tokio", "rustls", "rustls--aws_lc_rs", "rustls-native-certs"], optional = true }
rom-nats = { path = "../../crates/rom-nats" }
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream", "aws-lc-rs", "nuid"], optional = true }
rom = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", default-features = false }
rom-sql-core = { path = "../../crates/rom-sql-core" }
rom-oidc-presets = { path = "../../crates/rom-oidc-presets" }
rom-delivery-core = { path = "../../crates/rom-delivery-core" }
rom-webhook = { path = "../../crates/rom-webhook" }
postgres = { version = "=0.19.14", optional = true }
tokio = { version = "=1.53.1", features = ["rt", "macros", "net", "time", "sync"], optional = true }
tiberius = { version = "=0.13.0", default-features = false, features = ["tds73", "rustls"], optional = true }
tokio-util = { version = "=0.7.19", features = ["compat"], optional = true }

[[test]]
name = "projection_checkpoints"
required-features = ["projection-checkpoints"]
