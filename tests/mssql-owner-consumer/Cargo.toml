[package]
name = "mssql-owner-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
[workspace]
[dependencies]
rom-mssql = { path = "../../crates/rom-mssql" }
rom-sql-core = { path = "../../crates/rom-sql-core" }
tiberius = { version = "=0.13.0", default-features = false, features = ["tds73", "rustls"] }
tokio = { version = "=1.53.1", features = ["rt", "net", "time"] }
tokio-util = { version = "=0.7.19", features = ["compat"] }
