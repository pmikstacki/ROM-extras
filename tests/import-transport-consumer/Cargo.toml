[package]
name = "import-transport-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
[workspace]
[dependencies]
rom = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", default-features = false, features = ["derive"] }
rom-import = { path = "../../crates/rom-import" }
rom-import-transport = { path = "../../crates/rom-import-transport", features = ["http"] }
sha2 = "=0.10.9"
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["rt", "time", "macros", "sync"] }
rom-sqlite = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", features = ["test-support"] }
rom-redb = { git = "https://github.com/pmikstacki/ROM", rev = "d7ef529040eec60dc869034c2d33130219db85fe", features = ["test-support"] }
serde = { version = "=1.0.229", features = ["derive"] }
